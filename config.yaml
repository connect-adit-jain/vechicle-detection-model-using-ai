# Pipeline Configuration
# Edit this file to select components; never edit files inside models/

embedder:
  # Winner from embedder benchmark. Options: osnet_v1, osnet_grid_v1, dinov2_small_FALLBACK
  name: osnet_v1
  weights: null   # null = use pretrained ImageNet cache
  embed_dim: 512

embedder_grid:
  # Grid-pooled variant for heatmap visualisation
  name: osnet_grid_v1
  weights: null
  embed_dim: 4608
  enabled: true

# Tier 1: Real-Time Detection Engine (YOLO26)
# "YOLO26 ensures real-time detection even on low-power devices"
yolo26:
  role: "real_time_detection_low_power"
  default: yolo26x.pt
  low_power_fallback: yolo26n.pt
  weights: yolo26x.pt
  conf: 0.3
  imgsz: 640
  candidates:
    - yolo26x.pt   # Extra Large - highest accuracy
    - yolo26l.pt   # Large
    - yolo26m.pt   # Medium
    - yolo26s.pt   # Small
    - yolo26n.pt   # Nano - real-time on CPU (25.8 - 39.1 FPS)

# Backward-compatibility alias
detector:
  weights: yolo26x.pt
  default: yolo26x.pt
  conf: 0.3
  imgsz: 640

# Tier 2: Occlusion, Lighting & Visual Fingerprint Engine (YOLO27)
# "YOLO27 handles occlusion, lighting changes, and near-identical vehicles"
yolo27:
  role: "occlusion_lighting_and_near_identical_disambiguation"
  enabled: true
  features:
    # 1) Normal Recognition using Visual Fingerprints
    scratches_and_dents: true
    colour_lighting_invariant: true   # LAB decoupling
    dust_patterns: true
    headlights_and_carrier: true
    side_mirrors_and_handle_style: true
    stickers_and_decals: true
    rider_clothes: true              # for two-wheelers
    # 2) Disambiguation for Near-Identical Vehicles
    fastag_grid_placement: true      # 3x3 windshield grid location disambiguation
    tyre_dynamic_profile: true       # aspect / compression
    sitting_posture: false           # EXCLUDED

tracker:
  # Options: bytetrack, botsort, ocsort, deepocsort, fasttrack, tracktrack
  name: bytetrack
  config: bytetrack.yaml

matching:
  w_app: 0.60          # Visual appearance embedding weight
  w_attr: 0.0          # Attributes disabled (insufficient Indian fine-grained data)
  w_time: 0.30         # Spatio-temporal time gating weight
  w_fastag: 0.10       # FASTag 3x3 grid alignment cue
  threshold: 0.35      # Hungarian assignment threshold

attribute:
  enabled: false       # OFF (insufficient fine-grained Indian attribute data)
  model: null

fastag:
  enabled: true        # Active: 3x3 windshield placement disambiguation
  model: null          # Geometric template & color-contrast grid detector
  min_crop_width: 200   # minimum reliable windshield width in pixels

crop_selection:
  max_crops: 5
  min_crops: 3
  min_size: 64          # discard crops under 64x64

device: cuda

# 3D Monocular Spatial Distance & Localization Engine
distance_estimation:
  enabled: true
  camera_height_m: 6.0       # Mounting height of CCTV camera pole above roadway (meters)
  pitch_deg: 18.0            # Downward tilt angle of camera from horizon (degrees)
  vfov_deg: 42.0             # Vertical Field of View (degrees)
  hfov_deg: 65.0             # Horizontal Field of View (degrees)
  lane_width_m: 3.5          # Standard traffic lane width in meters
  draw_bev_radar: true       # Render top-down Bird's-Eye-View radar overlay
  radar_size_px: 260         # Resolution of radar HUD mini-map
